 <div class="col-lg-3">

     <div class="card text-center">
         <div class="card-header bg-primary">
           Add Client Form
         </div>
         <div class="card-body p-2">
              <form [formGroup] = "projectForm">
                 <div class="row p-2">
                   <div class="col">
                     <input type="text" class="form-control" formControlName = "projectName"  placeholder="Enter Person Name">
                   </div>
                 </div>
                 <div class="row p-2">
                     <div class="col">
                       <input type="text" class="form-control" formControlName = "startDate"  placeholder="Enter Contact Number" >
                     </div>
                     <div class="col">
                       <input type="text" class="form-control" formControlName = "expectedEndDate" placeholder="Enter City" >
                     </div>
                   </div>
                   <div class="row p-2">
                     <div class="col">
                       <input type="text" class="form-control" formControlName = "leadByEmpId" placeholder="Enter Project Name">
                     </div>
                     <div class="col">
                       <input type="date" class="form-control" formControlName = "completedDate" placeholder="select start date" >
                     </div>
                   </div>
                   <div class="row p-2">
                     <div class="col">
                        <input type="date" class="form-control" formControlName = "contactPerson" placeholder="select end date">
                     </div>
                     <div class="col">
                       <input type="text" class="form-control" formControlName = "contactPersonContactNo" placeholder="Enter contact name">
                     </div>
                   </div>
                   <div class="row p-2">
                     <div class="col">
                       <input type="number" class="form-control"  formControlName = "totalEmpWorking" placeholder="Enter contact number" >
                     </div>
                     <div class="col">
                       <input type="text" class="form-control" formControlName = "projectCost" placeholder="Enter Email">
                     </div>
                   </div>
                   <div class="row p-2">
                     <div class="col-md-6 col-lg-6">
                       <input type="number" class="form-control" formControlName = "projectDetails"  placeholder="Enter total employee count" >
                     </div>
                     <div class="col-md-6 col-lg-6">
                        <input type="number" class="form-control" formControlName = "contactPersonEmailId" placeholder="Enter project cost" >
                      </div>
                     
                   </div>                  
                  <div class="row p-2">
                    <div class="col-md-6 col-lg-6">
                      <select class="form-control"  placeholder="select client" >
                        <option>select client</option>
                      </select>
                    </div>
                    <div class="col-md-6 col-lg-6">
                       <input type="select" class="form-control"  placeholder="select employee" >
                     </div>
                    
                  </div>
                   <div class="row p-2">
                     <div class="col-md-6"><button text="addClient"> </button></div>                     
                     </div>    
                    </form>             
         </div>           
       </div> 

 </div>
</div>
